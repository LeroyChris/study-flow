<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f4f3ef]">

    <div class="min-h-screen flex">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 h-screen sticky top-0">

            <nav>
                <ul class="space-y-2">

                    <li>
                        <a href="../../index.html"
                            class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="../task-calendar/index.html"
                            class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-50 text-blue-600 transition text-sm font-medium">
                            Task Calendar
                        </a>
                    </li>

                    <li>
                        <a href="../pomodoro/index.html"
                            class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">
                            Pomodoro
                        </a>
                    </li>

                    <li>
                        <a href="../flashcards/index.html"
                            class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">
                            Flashcards
                        </a>
                    </li>

                </ul>
            </nav>

            <div class="space-y-4 border-t border-gray-100 pt-4">

                <div
                    class="flex items-center gap-3 px-4 py-2 text-sm text-gray-600 cursor-pointer hover:bg-gray-50 rounded-lg transition">
                    <span>🌙</span>
                    <span class="font-medium">Dark Mode</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2">

                    <div
                        class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                        S
                    </div>

                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-gray-700 leading-none">
                            Scholar
                        </span>
                        <span class="text-xs text-gray-400 mt-1">
                            University Student
                        </span>
                    </div>

                </div>

            </div>

        </aside>

        <!-- CONTENT -->
        <main class="flex-1 p-8">

            <div class="bg-white rounded-[32px] p-8 mx-auto shadow-sm">

                <!-- HEADER -->
                <div class="flex justify-between items-center mb-8">

                    <h1 class="text-4xl font-bold text-[#1f2340]">
                        Calendar
                    </h1>

                    <div class="flex bg-gray-100 rounded-xl p-1">
                        <button class="px-5 py-2 text-gray-700 font-medium">
                            Today
                        </button>

                        <button class="px-5 py-2 bg-blue-600 text-white rounded-lg font-medium">
                            Month
                        </button>

                        <button class="px-5 py-2 text-gray-700 font-medium">
                            Week
                        </button>
                    </div>

                </div>

                <!-- CALENDAR -->
                <div class="border rounded-[24px] overflow-hidden bg-white">

                    <div class="flex justify-between items-center p-6 border-b">

                        <button
                            class="w-10 h-10 rounded-xl border flex items-center justify-center hover:bg-gray-50">
                            ‹
                        </button>

                        <h2 class="text-3xl font-bold text-[#1f2340]">
                            June 2026
                        </h2>

                        <button
                            class="w-10 h-10 rounded-xl border flex items-center justify-center hover:bg-gray-50">
                            ›
                        </button>

                    </div>

                    <!-- DAYS -->
                    <div class="grid grid-cols-7 border-b">

                        <div class="text-center py-4 text-gray-500 font-medium">Sun</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Mon</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Tue</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Wed</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Thu</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Fri</div>
                        <div class="text-center py-4 text-gray-500 font-medium">Sat</div>

                    </div>

                    <!-- DATES -->
                    <div class="grid grid-cols-7 text-gray-700">

                        <!-- Row 1 -->
                        <div class="h-28 border bg-gray-50 flex items-center justify-center text-gray-400">31</div>
                        <div class="h-28 border flex items-center justify-center">1</div>
                        <div class="h-28 border flex items-center justify-center">2</div>
                        <div class="h-28 border flex items-center justify-center">3</div>
                        <div class="h-28 border flex items-center justify-center">4</div>

                        <div class="h-28 border flex items-center justify-center">
                            <div
                                class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold">
                                5
                            </div>
                        </div>

                        <div class="h-28 border flex items-center justify-center">6</div>

                        <div class="h-28 border flex items-center justify-center">7</div>
                        <div class="h-28 border flex items-center justify-center">8</div>
                        <div class="h-28 border flex items-center justify-center">9</div>
                        <div class="h-28 border flex items-center justify-center">10</div>
                        <div class="h-28 border flex items-center justify-center">11</div>
                        <div class="h-28 border flex items-center justify-center">12</div>
                        <div class="h-28 border flex items-center justify-center">13</div>

                        <div class="h-28 border flex items-center justify-center">14</div>
                        <div class="h-28 border flex items-center justify-center">15</div>
                        <div class="h-28 border flex items-center justify-center">16</div>
                        <div class="h-28 border flex items-center justify-center">17</div>
                        <div class="h-28 border flex items-center justify-center">18</div>
                        <div class="h-28 border flex items-center justify-center">19</div>
                        <div class="h-28 border flex items-center justify-center">20</div>

                        <div class="h-28 border flex items-center justify-center">21</div>
                        <div class="h-28 border flex items-center justify-center">22</div>
                        <div class="h-28 border flex items-center justify-center">23</div>
                        <div class="h-28 border flex items-center justify-center">24</div>
                        <div class="h-28 border flex items-center justify-center">25</div>
                        <div class="h-28 border flex items-center justify-center">26</div>
                        <div class="h-28 border flex items-center justify-center">27</div>

                        <div class="h-28 border flex items-center justify-center">28</div>
                        <div class="h-28 border flex items-center justify-center">29</div>
                        <div class="h-28 border flex items-center justify-center">30</div>
                        <div class="h-28 border bg-gray-50 flex items-center justify-center text-gray-400">1</div>
                        <div class="h-28 border bg-gray-50 flex items-center justify-center text-gray-400">2</div>
                        <div class="h-28 border bg-gray-50 flex items-center justify-center text-gray-400">3</div>
                        <div class="h-28 border bg-gray-50 flex items-center justify-center text-gray-400">4</div>

                    </div>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
