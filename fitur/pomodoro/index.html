<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f4f3ef]">

     <div class="min-h-screen flex">
        
            <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 h-screen sticky top-0">
                <nav>
                    <ul class="space-y-2">
                        <li>
                            <a href="../../index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">Home</a>
                        </li>
                        <li>
                            <a href="../task-calendar/index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">Task Calendar</a>
                        </li>
                        <li>
                            <a href="../pomodoro/index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">Pomodoro</a>
                        </li>
                        <li>
                            <a href="./index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition text-sm font-medium">Flashcards</a>
                        </li>
                    </ul>
                </nav>

                <div class="space-y-4 border-t border-gray-100 pt-4">
                    <div class="flex items-center gap-3 px-4 py-2 text-sm text-gray-600 cursor-pointer hover:bg-gray-50 rounded-lg transition">
                        <span>🌙</span>
                        <span class="font-medium">Dark Mode</span>                        
                    </div>

                    <div class="flex items-center gap-3 px-4 py-2">
                        <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                            S
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-semibold text-gray-700 leading-none">Scholar</span>
                            <span class="text-xs text-gray-400 mt-1">University Student</span>
                        </div>
                    </div>
                </div>
            </aside>


            <main class="flex-1 p-10">

                <div class="bg-white rounded-[32px] mx-auto max-w-md p-8 text-center shadow-sm">

                    <div class="flex bg-gray-100 p-1 rounded-full justify-between items-center mb-8">
                        <button class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-full text-sm">
                            Focus
                        </button>
                        <button class="text-gray-500 font-medium py-2 px-4 text-sm">
                            Short Break
                        </button>
                        <button class="text-gray-500 font-medium py-2 px-4 text-sm">
                            Long Break
                        </button>
                    </div>

                    <div class="relative w-60 h-60 mx-auto flex items-center justify-center mb-8">
                        <div class="absolute inset-0 rounded-full border-[10px] border-blue-600"></div>
                        <div class="z-10">
                            <h1 class="text-5xl font-bold text-gray-900 tracking-tight">25:00</h1>
                            <p class="text-xs text-gray-400 font-semibold mt-1 capitalize tracking-widest">Focus</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-center gap-6 mb-8">
                        <button class="w-14 h-14 bg-[#f0efe9] rounded-2xl flex items-center justify-center text-gray-500 text-2xl">
                            ↺
                        </button>
                        <button class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-200">
                            <svg class="w-10 h-10 fill-current ml-1" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </button>
                        <button class="w-14 h-14 bg-[#f0efe9] rounded-2xl flex items-center justify-center text-gray-500 text-2xl">
                            ⇥
                        </button>
                    </div>

                </div>

            </main>

     </div> 
    
</body>
</html>
