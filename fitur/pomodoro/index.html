<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f3ef] p-10">

    <div class="bg-white rounded-[32px] mx-auto p-8 text-center">

        <div class="flex bg-gray-100 p-1 rounded-full justify-between items-center mb-8">

            <button class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-full text-sm">
                Focus
            </button>

            <button class="text-gray-500 font-medium py-2 px-4 text-sm">
                Short Break
            </button>

            <button class="text-gray-500 font-medium py-2 px-4 text-sm">
                Long Break
            </button>

        </div>
        <div class="relative w-60 h-60 mx-auto flex items-center justify-center mb-8">
            <div class="absolute inset-0 rounded-full border-[10px] border-blue-600"></div>

            <div  class="z-10">
                <h1 class="text-5xl font-bold text-gray-900 tracking-tight">25:00</h1>
                <p class="text-xs text-gray-400 font-semibold mt-1 capitalize tracking-widest">Focus</p>
            </div>
        </div>

        <div class="flex items-center justify-center gap-6 mb-8">

            <button class="w-14 h-14 bg-[#f0efe9] rounded-2xl flex items-center justify-center text-gray-500 text-2xl">
                ↺
            </button>

            <button class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-200">
                <svg class="w-10 h-10 fill-current ml-1" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>

            <button class="w-14 h-14 bg-[#f0efe9] rounded-2xl flex items-center justify-center text-gray-500 text-2xl">
                ⇥
            </button>
        </div>

    </div>
    
</body>
</html>
